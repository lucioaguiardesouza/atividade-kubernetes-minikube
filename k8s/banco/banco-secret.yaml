# Secret com as credenciais do banco.
# stringData permite escrever em texto puro; o Kubernetes converte para base64.
# (Em produção a senha NÃO ficaria no Git - aqui é só para fins didáticos.)
apiVersion: v1
kind: Secret
metadata:
  name: banco-secret
type: Opaque
stringData:
  POSTGRES_DB: notas
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: senha-super-secreta
