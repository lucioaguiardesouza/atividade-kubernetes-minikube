# Service ClusterIP: dá um nome DNS fixo ("banco-service") ao banco, visível só dentro do cluster.
# A aplicação usa DB_HOST=banco-service para se conectar.
apiVersion: v1
kind: Service
metadata:
  name: banco-service
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
