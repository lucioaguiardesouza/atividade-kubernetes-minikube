# Dashboard "Atividade K8s - App Notas" carregado automaticamente pelo Grafana
# (o sidecar do Grafana lê ConfigMaps com o label grafana_dashboard: "1").
# Mostra num só painel: métricas (Prometheus), logs (Loki) e traces (Tempo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-app-notas
  namespace: observabilidade
  labels:
    grafana_dashboard: "1"
data:
  app-notas.json: |
    {
      "title": "Atividade K8s - App Notas",
      "uid": "app-notas",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "tags": ["atividade", "kubernetes"],
      "panels": [
        {
          "type": "row", "title": "Métricas (Prometheus)", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "stat", "title": "Replicas da app ativas (Running)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "targets": [{ "refId": "A", "expr": "sum(kube_pod_status_phase{namespace=\"default\", pod=~\"app-notas.*\", phase=\"Running\"})" }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "type": "stat", "title": "Banco de dados (Running)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 6 },
          "targets": [{ "refId": "A", "expr": "sum(kube_pod_status_phase{namespace=\"default\", pod=~\"postgres.*\", phase=\"Running\"})" }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "type": "timeseries", "title": "Uso de CPU por pod (cores)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 10, "w": 9, "x": 6, "y": 1 },
          "targets": [{ "refId": "A", "legendFormat": "{{pod}}", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"default\", container!=\"\", container!=\"POD\"}[2m]))" }]
        },
        {
          "type": "timeseries", "title": "Uso de memoria por pod",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 10, "w": 9, "x": 15, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [{ "refId": "A", "legendFormat": "{{pod}}", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"default\", container!=\"\", container!=\"POD\"})" }]
        },
        {
          "type": "row", "title": "Logs (Loki)", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 11 }
        },
        {
          "type": "timeseries", "title": "Requisicoes por replica (balanceamento de carga)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 9, "w": 8, "x": 0, "y": 12 },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } }, "overrides": [] },
          "targets": [{ "refId": "A", "queryType": "range", "legendFormat": "{{k8s_pod_name}}", "expr": "sum by (k8s_pod_name) (count_over_time({k8s_namespace_name=\"default\", k8s_container_name=\"app\"} |= \"requisicao\" [1m]))" }]
        },
        {
          "type": "logs", "title": "Logs da aplicacao e do banco",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 9, "w": 16, "x": 8, "y": 12 },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
          "targets": [{ "refId": "A", "queryType": "range", "expr": "{k8s_namespace_name=\"default\"}" }]
        },
        {
          "type": "row", "title": "Traces (Tempo / OpenTelemetry)", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 }
        },
        {
          "type": "table", "title": "Ultimas requisicoes rastreadas (clique no Trace ID)",
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 22 },
          "targets": [{ "refId": "A", "queryType": "traceql", "query": "{resource.service.name=\"app-notas\" && name !~ \"health\"}", "limit": 20, "tableType": "traces" }]
        }
      ]
    }
